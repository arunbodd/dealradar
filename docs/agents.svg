  <text x="460" y="244" fill="#9CA3AF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9.5" text-anchor="middle">buyer / seller verdict</text>
  <text x="460" y="261" fill="#C4B49A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="middle">Claude Haiku</text>

  <!-- Concierge QA -->
  <rect x="618" y="172" width="248" height="98" rx="5"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="638" cy="190" r="10" fill="#1F2937"/>
  <text x="638" y="194" fill="#FFFFFF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" font-weight="700" text-anchor="middle">5</text>
  <text x="742" y="210" fill="#111827"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" font-weight="600" text-anchor="middle">Concierge QA</text>
  <text x="742" y="228" fill="#9CA3AF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9.5" text-anchor="middle">Follow-up questions answered</text>
  <text x="742" y="244" fill="#9CA3AF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9.5" text-anchor="middle">grounded in current session</text>
  <text x="742" y="261" fill="#C4B49A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="middle">Claude Haiku</text>

  <!-- ── Footer ── -->
  <line x1="18" y1="296" x2="902" y2="296" stroke="#E5E7EB" stroke-width="1"/>
  <text x="460" y="310" fill="#C4B49A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="middle" letter-spacing="0.5">github.com/arunbodd/dealradar</text>
</svg>
