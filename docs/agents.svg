  <text x="828" y="23" fill="#B8A990"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="end">runs on every query</text>

  <!-- Stage 1 box  (centered pair: total width = 2*220 + 60gap = 500, start = (920-500)/2 = 210) -->
  <rect x="210" y="34" width="220" height="86" rx="5"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="230" cy="52" r="10" fill="#1F2937"/>
  <text x="230" y="56" fill="#FFFFFF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" font-weight="700" text-anchor="middle">1</text>
  <text x="320" y="74" fill="#111827"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" font-weight="600" text-anchor="middle">Stage 1 — Normaliser</text>
  <text x="320" y="91" fill="#9CA3AF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9.5" text-anchor="middle">Raw query to clean description</text>
  <text x="320" y="109" fill="#C4B49A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="middle">Claude Sonnet</text>

  <!-- Arrow Stage 1 to Stage 2 -->
  <line x1="432" y1="77" x2="486" y2="77"
        stroke="#9CA3AF" stroke-width="1.4" marker-end="url(#arr)"/>

  <!-- Stage 2 box -->
  <rect x="490" y="34" width="220" height="86" rx="5"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="510" cy="52" r="10" fill="#1F2937"/>
  <text x="510" y="56" fill="#FFFFFF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
