<svg width="920" height="316" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 316">
  <defs>
    <marker id="arr" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M1,2 L8,5 L1,8" fill="none" stroke="#9CA3AF" stroke-width="1.4"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="316" fill="#F7F6F3"/>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- SECTION 1: Search Pipeline                        -->
  <!-- ══════════════════════════════════════════════════ -->
  <rect x="18" y="18" width="884" height="118" rx="6"
        fill="none" stroke="#D4722A" stroke-width="1" stroke-dasharray="5,4"/>
  <rect x="30" y="11" width="142" height="16" rx="3" fill="#F7F6F3"/>
  <text x="38" y="23" fill="#D4722A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
