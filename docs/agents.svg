  <text x="600" y="109" fill="#C4B49A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="middle">Claude Sonnet · LangSmith traced</text>

  <!-- ══════════════════════════════════════════════════ -->
  <!-- SECTION 2: On Demand                              -->
  <!-- ══════════════════════════════════════════════════ -->
