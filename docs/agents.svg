  <text x="178" y="244" fill="#9CA3AF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9.5" text-anchor="middle">buy / negotiate / pass</text>
  <text x="178" y="261" fill="#C4B49A"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" text-anchor="middle">Claude Sonnet</text>

  <!-- Market Pulse -->
  <rect x="336" y="172" width="248" height="98" rx="5"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="356" cy="190" r="10" fill="#1F2937"/>
  <text x="356" y="194" fill="#FFFFFF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="9" font-weight="700" text-anchor="middle">4</text>
  <text x="460" y="210" fill="#111827"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
