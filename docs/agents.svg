  <!-- Deal Analyst  (3 boxes: width=248, gap=34, total=3*248+2*34=744+68=812, start=(920-812)/2=54) -->
  <rect x="54" y="172" width="248" height="98" rx="5"
        fill="#FFFFFF" stroke="#E5E7EB" stroke-width="1"/>
  <circle cx="74" cy="190" r="10" fill="#1F2937"/>
  <text x="74" y="194" fill="#FFFFFF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
