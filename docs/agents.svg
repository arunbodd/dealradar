  <text x="600" y="74" fill="#111827"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
        font-size="12" font-weight="600" text-anchor="middle">Stage 2 — Intent Extractor</text>
  <text x="600" y="91" fill="#9CA3AF"
        font-family="ui-sans-serif,system-ui,-apple-system,Arial,sans-serif"
